<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff4081">
    <meta name="description" content="Flirt Bird - увлекательная игра про птичку, которая летает и собирает сердечки">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flirt Bird">
    <meta name="msapplication-TileColor" content="#ff4081">
    <meta name="msapplication-TileImage" content="icons/icon-144x144.png">
    <!-- PWA мета-теги -->
    <meta name="application-name" content="Flirt Bird">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FlirtBird">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Иконки -->

    <title>Flirt Bird</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b8b, #ff8e53);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .game-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 60%, #98FB98 100%);
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .score-display {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            z-index: 10;
            padding: 0 10px;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 85px;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #ff4081;
            display: block;
        }

        .score-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .game-title {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            text-shadow: 3px 3px 0 rgba(255, 64, 129, 0.5);
            font-size: 32px;
            z-index: 10;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: none;
            z-index: 100;
            width: 90%;
            max-width: 350px;
            border: 4px solid #ff4081;
        }

        .game-over h2 {
            color: #ff4081;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .final-stats {
            margin: 15px 0;
            font-size: 18px;
            color: #333;
            line-height: 1.5;
        }

        .restart-btn {
            background: linear-gradient(to bottom, #ff4081, #d81b60);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 22px;
            border-radius: 45px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
            width: 100%;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s;
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        .tap-hint {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 20px;
            margin: 0 15px;
            backdrop-filter: blur(5px);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .hearts-display {
            position: absolute;
            top: 150px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 36px;
            color: #ff4081;
            z-index: 10;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .score-value { font-size: 22px; }
            .game-title { font-size: 28px; top: 90px; }
            .game-over h2 { font-size: 26px; }
            .restart-btn { padding: 16px 25px; font-size: 20px; }
            .hearts-display { font-size: 32px; top: 130px; }
        }

        @media (max-width: 480px) {
            .score-item {
                padding: 6px 12px;
                min-width: 75px;
            }
            .score-value { font-size: 20px; }
            .score-label { font-size: 10px; }
            .game-title { font-size: 24px; top: 80px; }
            .game-over { padding: 20px; }
            .game-over h2 { font-size: 22px; }
            .restart-btn { padding: 14px 20px; font-size: 18px; }
            .tap-hint { font-size: 16px; bottom: 30px; }
            .hearts-display { font-size: 28px; top: 120px; }
        }

        @media (max-height: 600px) {
            .score-display { top: 10px; }
            .game-title { top: 60px; font-size: 22px; }
            .hearts-display { top: 110px; font-size: 26px; }
            .tap-hint { bottom: 20px; font-size: 14px; }
        }

        .heart-collect {
            position: absolute;
            font-size: 28px;
            color: #ff4081;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-40px);
                opacity: 0;
            }
        }

        .jump-effect {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            animation: expand 0.3s ease-out forwards;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes expand {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #ff6b8b, #ff8e53);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 20px;
            margin-top: 10px;
        }

        .sound-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .sound-icon {
            font-size: 22px;
            color: #ff4081;
        }

        .sound-icon.muted {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
        <div class="loading-text">Загрузка игры...</div>
    </div>

    <div class="sound-toggle" id="soundToggle">
        <div class="sound-icon" id="soundIcon">🔊</div>
    </div>

    <div class="game-container">
        <div class="score-display">
            <div class="score-item">
                <span class="score-value" id="score">0</span>
                <span class="score-label">СЧЕТ</span>
            </div>
            <div class="score-item">
                <span class="score-value" id="highScore">0</span>
                <span class="score-label">РЕКОРД</span>
            </div>
            <div class="score-item">
                <span class="score-value" id="heartsCount">0</span>
                <span class="score-label">СЕРДЕЧКИ</span>
            </div>
        </div>

        <div class="game-title">FLIRT BIRD</div>
        
        <div class="hearts-display" id="heartsUI">❤️ ❤️ ❤️ ❤️ ❤️</div>

        <canvas id="gameCanvas"></canvas>

        <div class="tap-hint">ТАПНИ, ЧТОБЫ ПРЫГНУТЬ!</div>

        <div class="game-over" id="gameOverScreen">
            <h2>ИГРА ОКОНЧЕНА</h2>
            <div class="final-stats">
                <div>Твой счет: <span id="finalScore">0</span></div>
                <div>Рекорд: <span id="finalHighScore">0</span></div>
                <div>Собрано сердец: <span id="finalHearts">0</span></div>
            </div>
            <button class="restart-btn" id="restartButton">ИГРАТЬ СНОВА</button>
        </div>
    </div>

    <!-- Аудио элементы -->
    <audio id="jumpSound" preload="auto"></audio>
    <audio id="collectSound" preload="auto"></audio>
    <audio id="hitSound" preload="auto"></audio>
    <audio id="scoreSound" preload="auto"></audio>
    <audio id="backgroundMusic" preload="auto" loop></audio>

    <script>
        // Инициализация звуковой системы
        class SoundSystem {
            constructor() {
                this.sounds = {
                    jump: document.getElementById('jumpSound'),
                    collect: document.getElementById('collectSound'),
                    hit: document.getElementById('hitSound'),
                    score: document.getElementById('scoreSound'),
                    background: document.getElementById('backgroundMusic')
                };
                
                this.soundEnabled = true;
                this.audioContext = null;
                this.initialized = false;
                
                // Генерация звуков через Web Audio API
                this.initSounds();
                this.setupSoundToggle();
            }
            
            initSounds() {
                try {
                    // Создаем AudioContext (современный API)
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Генерируем звуки
                    this.generateJumpSound();
                    this.generateCollectSound();
                    this.generateHitSound();
                    this.generateScoreSound();
                    this.generateBackgroundMusic();
                    
                    this.initialized = true;
                    console.log("🎵 Звуковая система инициализирована");
                } catch (error) {
                    console.warn("⚠️ Web Audio API не поддерживается, звуки отключены");
                    this.soundEnabled = false;
                    document.getElementById('soundToggle').style.display = 'none';
                }
            }
            
            // Генерация звука прыжка
            generateJumpSound() {
                const duration = 0.2;
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                oscillator.frequency.setValueAtTime(600, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, this.audioContext.currentTime + duration);
                
                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                
                oscillator.start();
                oscillator.stop(this.audioContext.currentTime + duration);
                
                // Сохраняем параметры для воспроизведения
                this.jumpSoundParams = { duration, oscillator: oscillator.type, frequency: 600 };
            }
            
            // Генерация звука сбора сердечка
            generateCollectSound() {
                const duration = 0.4;
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, this.audioContext.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, this.audioContext.currentTime + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, this.audioContext.currentTime + 0.2); // G5
                
                gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, this.audioContext.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                
                oscillator.start();
                oscillator.stop(this.audioContext.currentTime + duration);
            }
            
            // Генерация звука столкновения
            generateHitSound() {
                const duration = 0.5;
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(50, this.audioContext.currentTime + duration);
                
                gainNode.gain.setValueAtTime(0.4, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                
                oscillator.start();
                oscillator.stop(this.audioContext.currentTime + duration);
            }
            
            // Генерация звука набора очков
            generateScoreSound() {
                const duration = 0.3;
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(800, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(600, this.audioContext.currentTime + duration);
                
                gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                
                oscillator.start();
                oscillator.stop(this.audioContext.currentTime + duration);
            }
            
            // Генерация фоновой музыки
            generateBackgroundMusic() {
                // Простая фоновая мелодия
                const notes = [
                    { freq: 523.25, duration: 0.5 }, // C5
                    { freq: 587.33, duration: 0.5 }, // D5
                    { freq: 659.25, duration: 0.5 }, // E5
                    { freq: 698.46, duration: 0.5 }, // F5
                ];
                
                let currentTime = this.audioContext.currentTime;
                
                notes.forEach((note, index) => {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(note.freq, currentTime);
                    
                    gainNode.gain.setValueAtTime(0, currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.05, currentTime + 0.05);
                    gainNode.gain.linearRampToValueAtTime(0, currentTime + note.duration);
                    
                    oscillator.start(currentTime);
                    oscillator.stop(currentTime + note.duration);
                    
                    currentTime += note.duration;
                });
            }
            
            // Воспроизведение звука прыжка (оптимизированная версия)
            playJump() {
                if (!this.soundEnabled || !this.initialized) return;
                
                try {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(600, this.audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(400, this.audioContext.currentTime + 0.2);
                    
                    gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                    
                    oscillator.start();
                    oscillator.stop(this.audioContext.currentTime + 0.2);
                } catch (e) {
                    console.log("Ошибка воспроизведения звука прыжка");
                }
            }
            
            // Воспроизведение звука сбора
            playCollect() {
                if (!this.soundEnabled || !this.initialized) return;
                
                try {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.type = 'sine';
                    
                    // Восходящая арпеджио
                    oscillator.frequency.setValueAtTime(523.25, this.audioContext.currentTime); // C5
                    oscillator.frequency.setValueAtTime(659.25, this.audioContext.currentTime + 0.1); // E5
                    oscillator.frequency.setValueAtTime(783.99, this.audioContext.currentTime + 0.2); // G5
                    
                    gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.3, this.audioContext.currentTime + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.4);
                    
                    oscillator.start();
                    oscillator.stop(this.audioContext.currentTime + 0.4);
                } catch (e) {
                    console.log("Ошибка воспроизведения звука сбора");
                }
            }
            
          // Воспроизведение звука столкновения - БЫСТРОЕ "ТЛУЛУЛУЛУ"
playHit() {
    if (!this.soundEnabled || !this.initialized) return;
    
    try {
        const time = this.audioContext.currentTime;
        const duration = 0.6;
        
        // Создаем несколько осцилляторов для эффекта дребезжания
        const oscillators = [];
        const gains = [];
        
        // Создаем 3 осциллятора с разными частотами
        for (let i = 0; i < 3; i++) {
            const oscillator = this.audioContext.createOscillator();
            const gainNode = this.audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(this.audioContext.destination);
            
            // Разные частоты для создания эффекта "тлулулулу"
            oscillator.type = 'triangle';
            const baseFreq = 200 + (i * 50); // 200, 250, 300 Гц
            
            // Создаем эффект вибрации изменением частоты
            oscillator.frequency.setValueAtTime(baseFreq, time);
            oscillator.frequency.setValueAtTime(baseFreq + 100, time + 0.1);
            oscillator.frequency.setValueAtTime(baseFreq, time + 0.2);
            oscillator.frequency.setValueAtTime(baseFreq + 100, time + 0.3);
            oscillator.frequency.setValueAtTime(baseFreq, time + 0.4);
            
            // Разная громкость для каждого осциллятора
            const volume = 0.15 - (i * 0.05); // 0.15, 0.10, 0.05
            gainNode.gain.setValueAtTime(0, time);
            gainNode.gain.linearRampToValueAtTime(volume, time + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + duration - (i * 0.1));
            
            oscillators.push(oscillator);
            gains.push(gainNode);
            
            // Запускаем с небольшой задержкой для эффекта эха
            oscillator.start(time + (i * 0.02));
            oscillator.stop(time + duration - (i * 0.1));
        }
        
    } catch (e) {
        console.log("Ошибка воспроизведения звука столкновения");
    }
}
            
           // Воспроизведение звука набора очков - НОВЫЙ ЗВУК
playScore() {
    if (!this.soundEnabled || !this.initialized) return;
    
    try {
        const time = this.audioContext.currentTime;
        const duration = 0.25;
        
        const oscillator1 = this.audioContext.createOscillator();
        const oscillator2 = this.audioContext.createOscillator();
        const gainNode = this.audioContext.createGain();
        
        oscillator1.connect(gainNode);
        oscillator2.connect(gainNode);
        gainNode.connect(this.audioContext.destination);
        
        // Первый осциллятор - основной тон
        oscillator1.type = 'sine';
        oscillator1.frequency.setValueAtTime(1046.50, time); // C6
        oscillator1.frequency.exponentialRampToValueAtTime(1318.51, time + duration); // E6
        
        // Второй осциллятор - гармоника
        oscillator2.type = 'triangle';
        oscillator2.frequency.setValueAtTime(1567.98, time); // G6
        oscillator2.frequency.exponentialRampToValueAtTime(2093.00, time + duration); // C7
        
        gainNode.gain.setValueAtTime(0, time);
        gainNode.gain.linearRampToValueAtTime(0.1, time + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, time + duration);
        
        oscillator1.start(time);
        oscillator2.start(time);
        oscillator1.stop(time + duration);
        oscillator2.stop(time + duration);
    } catch (e) {
        console.log("Ошибка воспроизведения звука очков");
    }
}
                setupSoundToggle() {
                const soundToggle = document.getElementById('soundToggle');
                const soundIcon = document.getElementById('soundIcon');
                
                soundToggle.addEventListener('click', () => {
                    this.soundEnabled = !this.soundEnabled;
                    
                    if (this.soundEnabled) {
                        soundIcon.textContent = '🔊';
                        soundIcon.classList.remove('muted');
                        // Возобновляем AudioContext если он был приостановлен
                        if (this.audioContext && this.audioContext.state === 'suspended') {
                            this.audioContext.resume();
                        }
                    } else {
                        soundIcon.textContent = '🔇';
                        soundIcon.classList.add('muted');
                    }
                    
                    // Сохраняем настройку звука
                    localStorage.setItem('flirtBirdSoundEnabled', this.soundEnabled);
                });
                
                // Загружаем сохраненную настройку звука
                const savedSoundSetting = localStorage.getItem('flirtBirdSoundEnabled');
                if (savedSoundSetting !== null) {
                    this.soundEnabled = savedSoundSetting === 'true';
                    if (!this.soundEnabled) {
                        soundIcon.textContent = '🔇';
                        soundIcon.classList.add('muted');
                    }
                }
            }
        }

        // Скрываем экран загрузки когда все готово
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                }, 300);
            }, 500);
        });

        // Получаем элементы
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const birdImage = new Image();
        birdImage.src = "assets/bird.png";
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const heartsCountElement = document.getElementById('heartsCount');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const finalHighScoreElement = document.getElementById('finalHighScore');
        const finalHeartsElement = document.getElementById('finalHearts');
        const restartButton = document.getElementById('restartButton');
        const heartsUI = document.getElementById('heartsUI');
        const tapHint = document.querySelector('.tap-hint');

        // Константы для регулировки скорости
        const PIPE_SPEED = 2.5;
        const PIPE_INTERVAL = 110;
        const PIPE_GAP = 180;
        const TAP_DELAY = 300;

        // Day/Night cycle settings
        const DAY_NIGHT_DURATION = 60 * 1000; // 1 minute per phase
        const TRANSITION_DURATION = 2000; // smooth transition in ms
        let phaseStartTime = Date.now();
        let isDay = true;
        // Blend value between 0..1 where 1 = full day, 0 = full night. Updated in updateDayNight()
        let dayBlend = 1;
        let stars = [];
        let numStars = 120;

        // Инициализация звуковой системы
        let soundSystem;
        
        // Настройка canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            bird.width = Math.max(36, canvas.width * 0.072);
            bird.height = Math.max(30, canvas.width * 0.06);
            bird.x = canvas.width * 0.15;
            
            pipeGap = Math.max(PIPE_GAP, canvas.height * 0.28);
            pipeWidth = Math.max(60, canvas.width * 0.08);
            
            if (gameRunning && !gameStarted) {
                tapHint.style.display = 'none';
            }

            // regenerate stars to fit new canvas size
            generateStars();
        }

        // Игровые переменные
        let bird = {
            x: 100,
            y: 300,
            width: 40,
            height: 30,
            velocity: 0,
            gravity: 0.3,
            jump: -8.7
        };

        let pipes = [];
        let hearts = [];
        let score = 0;
        let highScore = localStorage.getItem('flirtBirdHighScore') || 0;
        let heartsCount = 0;
        let gameRunning = true;
        let gameStarted = false;
        let pipeInterval = PIPE_INTERVAL;
        let frameCount = 0;
        let pipeWidth = 70;
        let pipeGap = PIPE_GAP;
        let lastTapTime = 0;

        highScoreElement.textContent = highScore;

        // Создание препятствий
        function createPipe() {
            const minHeight = canvas.height * 0.1;
            const maxHeight = canvas.height - pipeGap - minHeight;
            const topPipeHeight = Math.random() * (maxHeight - minHeight) + minHeight;
            
            pipes.push({
                x: canvas.width,
                y: 0,
                width: pipeWidth,
                height: topPipeHeight,
                color: '#FF99CC',
                passed: false
            });
            
            pipes.push({
                x: canvas.width,
                y: topPipeHeight + pipeGap,
                width: pipeWidth,
                height: canvas.height - topPipeHeight - pipeGap,
                color: '#FF99CC',
                passed: false
            });
        }

        // Создание сердечек
        function createHeart() {
            if (Math.random() > 0.7 && pipes.length > 0) {
                const lastPipe = pipes[pipes.length - 2];
                hearts.push({
                    x: lastPipe.x + lastPipe.width / 2,
                    y: lastPipe.height + pipeGap / 2,
                    radius: Math.min(15, canvas.width * 0.03),
                    color: '#FF4081',
                    collected: false
                });
            }
        }

        // Прыжок с звуком
        function jump(e) {
            const currentTime = Date.now();
            if (currentTime - lastTapTime < TAP_DELAY) return;
            lastTapTime = currentTime;

            if (!gameRunning) return;
            
            gameStarted = true;
            tapHint.style.display = 'none';
            
            bird.velocity = bird.jump;
            
            // Воспроизводим звук прыжка
            if (soundSystem) {
                soundSystem.playJump();
            }
            
            // Эффект прыжка
            if (e && e.type === 'touchstart') {
                const touch = e.touches[0];
                createJumpEffect(touch.clientX, touch.clientY);
            } else if (e) {
                createJumpEffect(e.clientX, e.clientY);
            }
        }

        // Эффект прыжка
        function createJumpEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'jump-effect';
            effect.style.left = (x - 25) + 'px';
            effect.style.top = (y - 25) + 'px';
            document.body.appendChild(effect);
            
            setTimeout(() => effect.remove(), 300);
        }

        // Эффект сбора сердечка со звуком
        function createHeartEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'heart-collect';
            effect.textContent = '❤️ +20';
            effect.style.left = (x - 30) + 'px';
            effect.style.top = (y - 30) + 'px';
            document.body.appendChild(effect);
            
            updateHeartsUI();
            
            setTimeout(() => effect.remove(), 1000);
        }

        // Обновление UI сердечек
        function updateHeartsUI() {
            let heartsText = '';
            const totalHearts = Math.min(10, heartsCount);
            for (let i = 0; i < totalHearts; i++) {
                heartsText += '❤️ ';
            }
            heartsUI.textContent = heartsText || '❤️';
        }

        // Обновление игры
        function update() {
            if (!gameRunning) return;

            // Update day/night (handles phase switching and star twinkle)
            updateDayNight();

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y <= 0) {
                bird.y = 0;
                bird.velocity = 0;
            }
            
            if (bird.y + bird.height >= canvas.height) {
                gameOver();
                return;
            }

            frameCount++;
            if (frameCount % pipeInterval === 0) {
                createPipe();
                createHeart();
            }

            // Обновление препятствий
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= PIPE_SPEED;

                if (
                    bird.x < pipes[i].x + pipes[i].width &&
                    bird.x + bird.width > pipes[i].x &&
                    bird.y < pipes[i].y + pipes[i].height &&
                    bird.y + bird.height > pipes[i].y
                ) {
                    gameOver();
                    return;
                }

                if (pipes[i].x + pipes[i].width < 0) {
                    pipes.splice(i, 1);
                }

                if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                    pipes[i].passed = true;
                    if (i % 2 === 0) {
                        score += 5;
                        scoreElement.textContent = score;
                        // Звук набора очков
                        if (soundSystem) {
                            soundSystem.playScore();
                        }
                    }
                }
            }

            // Обновление сердечек
            for (let i = hearts.length - 1; i >= 0; i--) {
                hearts[i].x -= PIPE_SPEED;

                const dx = bird.x + bird.width/2 - hearts[i].x;
                const dy = bird.y + bird.height/2 - hearts[i].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (!hearts[i].collected && distance < bird.width/2 + hearts[i].radius) {
                    hearts[i].collected = true;
                    heartsCount++;
                    heartsCountElement.textContent = heartsCount;
                    score += 20;
                    scoreElement.textContent = score;
                    
                    // Звук сбора сердечка
                    if (soundSystem) {
                        soundSystem.playCollect();
                    }
                    
                    createHeartEffect(hearts[i].x, hearts[i].y);
                    
                    hearts.splice(i, 1);
                    continue;
                }

                if (hearts[i].x + hearts[i].radius < 0) {
                    hearts.splice(i, 1);
                }
            }

            // Увеличение сложности
            if (score > 100 && pipeInterval > 70) pipeInterval = 70;
            else if (score > 50 && pipeInterval > 85) pipeInterval = 85;
        }

        // Отрисовка
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw day/night background (handles transitions, stars, moon, and grass)
            drawBackground();

            ctx.drawImage(
    birdImage,
    bird.x,
    bird.y,
    bird.width,
    bird.height
);


            // Препятствия
            pipes.forEach(pipe => {
                ctx.fillStyle = pipe.color;
                ctx.fillRect(pipe.x, pipe.y, pipe.width, pipe.height);
                
                ctx.fillStyle = '#FF4081';
                ctx.fillRect(pipe.x - 5, pipe.y, 10, pipe.height);
                ctx.fillRect(pipe.x + pipe.width - 5, pipe.y, 10, pipe.height);
            });

            // Сердечки
            hearts.forEach(heart => {
                ctx.fillStyle = heart.color;
                ctx.beginPath();
                
                const topCurve = heart.radius * 0.8;
                ctx.moveTo(heart.x, heart.y + topCurve);
                
                ctx.bezierCurveTo(
                    heart.x, heart.y,
                    heart.x - heart.radius, heart.y,
                    heart.x - heart.radius, heart.y + topCurve
                );
                ctx.bezierCurveTo(
                    heart.x - heart.radius, heart.y + heart.radius * 1.5,
                    heart.x, heart.y + heart.radius * 1.8,
                    heart.x, heart.y + heart.radius * 2.5
                );
                ctx.bezierCurveTo(
                    heart.x, heart.y + heart.radius * 1.8,
                    heart.x + heart.radius, heart.y + heart.radius * 1.5,
                    heart.x + heart.radius, heart.y + topCurve
                );
                ctx.bezierCurveTo(
                    heart.x + heart.radius, heart.y,
                    heart.x, heart.y,
                    heart.x, heart.y + topCurve
                );
                
                ctx.fill();
            });

            drawClouds();
        }

        // Облака
        function drawClouds() {
            // Clouds are visible mainly during day. Fade with dayBlend.
            const cloudAlpha = 0.8 * dayBlend;
            if (cloudAlpha < 0.02) return;
            
            ctx.fillStyle = `rgba(255, 255, 255, ${cloudAlpha})`;
            
            const clouds = [
                {x: canvas.width * 0.2, y: canvas.height * 0.1, size: canvas.width * 0.05},
                {x: canvas.width * 0.6, y: canvas.height * 0.15, size: canvas.width * 0.06},
                {x: canvas.width * 0.8, y: canvas.height * 0.05, size: canvas.width * 0.04}
            ];
            
            clouds.forEach(cloud => {
                if (cloud.x < -cloud.size * 3) {
                    cloud.x = canvas.width + cloud.size;
                }
                cloud.x -= 0.3;
                
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.8, cloud.y - cloud.size * 0.2, cloud.size * 0.8, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 1.5, cloud.y, cloud.size * 0.9, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.8, cloud.y + cloud.size * 0.3, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Generate stars for night background
        function generateStars() {
            stars = [];
            const areaHeight = Math.max(100, canvas.height * 0.8);
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * areaHeight,
                    r: Math.random() * 1.5 + 0.3,
                    twinkleSpeed: 0.02 + Math.random() * 0.03,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        // Update day/night state and twinkle stars
        function updateDayNight() {
            const now = Date.now();
            const elapsed = now - phaseStartTime;
            // Switch phase if elapsed past duration
            if (elapsed >= DAY_NIGHT_DURATION) {
                isDay = !isDay;
                phaseStartTime = now;
            }
            const phaseElapsed = now - phaseStartTime;
            if (phaseElapsed < TRANSITION_DURATION) {
                const t = phaseElapsed / TRANSITION_DURATION;
                // If it's day phase, we fade from night to day (dayBlend goes 0->1)
                dayBlend = isDay ? t : 1 - t;
            } else {
                dayBlend = isDay ? 1 : 0;
            }
            // Update stars twinkle
            stars.forEach(s => {
                s.phase += s.twinkleSpeed;
                s.brightness = 0.5 + 0.5 * Math.sin(s.phase);
            });
        }

        // Draw blended background for day / night
        function drawBackground() {
            // Night gradient
            const nightGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            nightGradient.addColorStop(0, '#071029');
            nightGradient.addColorStop(1, '#02020a');

            // Day sky (keeps original look)
            const daySkyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
            daySkyGradient.addColorStop(0, '#87CEEB');
            daySkyGradient.addColorStop(1, '#87CEEB');

            // Grass color
            const dayGrass = '#98FB98';

            // First draw night layer with alpha (1 - dayBlend)
            if (1 - dayBlend > 0.005) {
                ctx.save();
                ctx.globalAlpha = 1 - dayBlend;
                ctx.fillStyle = nightGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Draw stars
                stars.forEach(s => {
                    const alpha = (s.brightness * 0.9);
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                // Moon
                ctx.beginPath();
                ctx.fillStyle = `rgba(240, 240, 220, ${0.9})`;
                const mx = canvas.width * 0.8;
                const my = Math.max(40, canvas.height * 0.12);
                ctx.arc(mx, my, Math.max(28, canvas.width * 0.04), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw day layer with alpha dayBlend
            if (dayBlend > 0.005) {
                ctx.save();
                ctx.globalAlpha = dayBlend;
                ctx.fillStyle = daySkyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);
                ctx.fillStyle = dayGrass;
                ctx.fillRect(0, canvas.height * 0.6, canvas.width, canvas.height * 0.4);
                ctx.restore();
            }
        }

        // Конец игры со звуком
        function gameOver() {
            if (!gameRunning) return;
            
            gameRunning = false;
            
            // Звук столкновения
            if (soundSystem) {
                soundSystem.playHit();
            }
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flirtBirdHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            
            finalScoreElement.textContent = score;
            finalHighScoreElement.textContent = highScore;
            finalHeartsElement.textContent = heartsCount;
            gameOverScreen.style.display = 'block';
        }

        // Перезапуск
        function restartGame() {
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            pipes = [];
            hearts = [];
            score = 0;
            heartsCount = 0;
            gameRunning = true;
            gameStarted = false;
            pipeInterval = PIPE_INTERVAL;
            frameCount = 0;
            
            scoreElement.textContent = score;
            heartsCountElement.textContent = heartsCount;
            gameOverScreen.style.display = 'none';
            
            tapHint.style.display = 'block';
            tapHint.style.animation = 'pulse 2s infinite';
            
            updateHeartsUI();
        }

        // Игровой цикл
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Обработчики событий
        function setupEventListeners() {
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                jump(e);
            });
            
            canvas.addEventListener('click', jump);
            
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    jump();
                }
            });
            
            restartButton.addEventListener('click', restartGame);
            
            window.addEventListener('resize', function() {
                resizeCanvas();
                if (gameRunning) {
                    bird.y = Math.min(bird.y, canvas.height - bird.height);
                }
            });
            
            canvas.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Первый клик/тап для активации звука
            document.addEventListener('click', function initSound() {
                if (soundSystem && soundSystem.audioContext && soundSystem.audioContext.state === 'suspended') {
                    soundSystem.audioContext.resume();
                }
                document.removeEventListener('click', initSound);
            }, { once: true });
        }

        // Инициализация
        function init() {
            // Инициализируем звуковую систему
            soundSystem = new SoundSystem();
            
            resizeCanvas();
            setupEventListeners();
            gameLoop();
            
            setTimeout(() => {
                if (gameRunning && !gameStarted) {
                    tapHint.style.animation = 'none';
                    setTimeout(() => {
                        tapHint.style.display = 'none';
                    }, 1000);
                }
            }, 5000);
        }

        // Запуск
        window.addEventListener('load', init);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker зарегистрирован');
                    })
                    .catch(error => {
                        console.log('Ошибка регистрации Service Worker:', error);
                    });
            });
        }
    </script>

// Простая регистрация Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(() => console.log('Service Worker зарегистрирован'))

}
// Скрытие адресной строки на мобильных устройствах
function hideAddressBar() {
  if (window.innerHeight < window.outerHeight) {
    setTimeout(() => window.scrollTo(0, 1), 100);
  }
}
// Применяем при загрузке
window.addEventListener('load', hideAddressBar);
window.addEventListener('orientationchange', hideAddressBar);
</script>
